[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mcstar-unified"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi==0.121.0", "uvicorn==0.38.0", "SQLAlchemy==2.0.44", "alembic==1.17.1", "psycopg[binary]==3.2.12", "argon2-cffi==25.1.0", "httpx==0.28.1", "python-multipart==0.0.20", "openpyxl==3.1.5", "xlrd==2.0.2", "Pillow==12.0.0", "defusedxml==0.7.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "xlwt==1.3.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
